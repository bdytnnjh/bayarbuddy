# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/imgs/app_icon.png"

  android: "launcher_icon"
  #image_path_android: "assets/imgs/app_icon_android.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/imgs/app_icon.png"
  adaptive_icon_monochrome: "assets/imgs/app_icon.png"
  adaptive_icon_background: "#ffffff"

  ios: true
  #image_path_ios: "assets/imgs/app_icon_ios.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  image_path_ios_dark_transparent: "assets/imgs/app_icon.png"
  image_path_ios_tinted_grayscale: "assets/imgs/app_icon.png"
  desaturate_tinted_to_grayscale_ios: true
